<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Mode | SHUSMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #C9A961;
            --dark-gold: #A07D3F;
            --light-gold: #E2CC8A;
            --cream: #FAF8F5;
            --brown: #5D4E37;
            --dark: #1A1A1A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--brown);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle pattern */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A961' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 560px;
            width: 100%;
        }

        /* Logo */
        .logo {
            margin-bottom: 2.5rem;
        }

        .logo svg {
            width: 56px;
            height: 64px;
        }

        /* Ornate Spinner */
        .spinner-wrapper {
            margin: 0 auto 2.5rem;
            width: 80px;
            height: 80px;
            position: relative;
        }

        .spinner-outer {
            width: 80px;
            height: 80px;
            border: 2px solid rgba(201,169,97,0.15);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spinOuter 2.5s linear infinite;
            position: absolute;
            top: 0;
            left: 0;
        }

        .spinner-inner {
            width: 56px;
            height: 56px;
            border: 1.5px solid rgba(201,169,97,0.1);
            border-bottom-color: var(--dark-gold);
            border-radius: 50%;
            animation: spinInner 1.8s linear infinite;
            position: absolute;
            top: 12px;
            left: 12px;
        }

        /* Ornate center of spinner */
        .spinner-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 24px;
            height: 24px;
        }

        .spinner-center svg {
            width: 24px;
            height: 24px;
            animation: pulse 2s ease-in-out infinite;
        }

        /* Decorative dots around spinner */
        .spinner-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            animation: spinOuter 8s linear infinite;
        }

        .spinner-dot {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            opacity: 0.4;
        }

        .spinner-dot:nth-child(1) { top: -4px; left: 50%; transform: translateX(-50%); opacity: 0.8; }
        .spinner-dot:nth-child(2) { bottom: -4px; left: 50%; transform: translateX(-50%); }
        .spinner-dot:nth-child(3) { left: -4px; top: 50%; transform: translateY(-50%); }
        .spinner-dot:nth-child(4) { right: -4px; top: 50%; transform: translateY(-50%); }

        @keyframes spinOuter {
            to { transform: rotate(360deg); }
        }

        @keyframes spinInner {
            to { transform: rotate(-360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Heading */
        .heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.5rem, 5vw, 2.25rem);
            font-weight: 500;
            color: var(--brown);
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        /* Subtext */
        .subtext {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.8125rem, 2.5vw, 0.9375rem);
            color: var(--brown);
            opacity: 0.6;
            line-height: 1.7;
            margin-bottom: 2rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Progress bar section */
        .progress-section {
            margin-bottom: 2.5rem;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .progress-text {
            font-family: 'Inter', sans-serif;
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--brown);
            opacity: 0.5;
        }

        .progress-percent {
            font-family: 'Inter', sans-serif;
            font-size: 0.6875rem;
            font-weight: 600;
            color: var(--gold);
        }

        .progress-bar-track {
            width: 100%;
            height: 3px;
            background: rgba(201,169,97,0.12);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--dark-gold), var(--gold), var(--light-gold));
            border-radius: 2px;
            animation: progressFill 4s ease-in-out infinite;
            position: relative;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: -2px;
            width: 7px;
            height: 7px;
            background: var(--gold);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(201,169,97,0.5);
        }

        @keyframes progressFill {
            0% { width: 15%; }
            50% { width: 75%; }
            100% { width: 15%; }
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .divider-line {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold));
        }

        .divider-line:last-child {
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        .divider-icon {
            width: 6px;
            height: 6px;
            border: 1px solid var(--gold);
            transform: rotate(45deg);
        }

        /* Email notify section */
        .notify-section {
            margin-bottom: 2rem;
        }

        .notify-heading {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: var(--brown);
            margin-bottom: 0.75rem;
            font-weight: 500;
        }

        .notify-form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 380px;
            margin: 0 auto;
        }

        .notify-input {
            padding: 13px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            color: var(--brown);
            background: rgba(201,169,97,0.05);
            border: 1px solid rgba(201,169,97,0.25);
            outline: none;
            transition: all 0.3s ease;
            width: 100%;
        }

        .notify-input::placeholder {
            color: var(--brown);
            opacity: 0.4;
        }

        .notify-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(201,169,97,0.1);
        }

        .notify-btn {
            padding: 13px 24px;
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            color: var(--cream);
            font-family: 'Inter', sans-serif;
            font-size: 0.8125rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .notify-btn:hover {
            background: linear-gradient(135deg, var(--dark-gold), var(--brown));
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(201,169,97,0.25);
        }

        /* Estimated time */
        .estimate {
            margin-bottom: 2.5rem;
            padding: 1rem 1.25rem;
            border: 1px solid rgba(201,169,97,0.15);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .estimate-icon {
            color: var(--gold);
            flex-shrink: 0;
        }

        .estimate-icon svg {
            width: 20px;
            height: 20px;
        }

        .estimate-text {
            font-size: 0.8125rem;
            color: var(--brown);
            opacity: 0.7;
            line-height: 1.5;
            text-align: left;
        }

        .estimate-time {
            font-weight: 600;
            color: var(--brown);
            opacity: 1;
        }

        /* Social links */
        .social-section {
            margin-top: 0.5rem;
        }

        .social-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.6875rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--brown);
            opacity: 0.4;
            margin-bottom: 0.75rem;
        }

        .social-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(201,169,97,0.2);
            color: var(--gold);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: var(--gold);
            color: var(--cream);
            transform: translateY(-2px);
        }

        .social-link svg {
            width: 18px;
            height: 18px;
        }

        /* Responsive */
        @media (min-width: 480px) {
            .notify-form {
                flex-direction: row;
            }

            .notify-btn {
                width: auto;
                flex-shrink: 0;
            }
        }

        @media (min-width: 768px) {
            .container {
                padding: 3rem 2rem;
            }

            .spinner-wrapper {
                width: 100px;
                height: 100px;
            }

            .spinner-outer {
                width: 100px;
                height: 100px;
            }

            .spinner-inner {
                width: 70px;
                height: 70px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <svg viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 4C8 2 9 1 11 1H28" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M8 4V72C8 74 9 76 11 76H28" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M28 1C30 1 31 2 31 4C31 6 29 7 27 6.5" stroke="#C9A961" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M31 4C31 2.5 32.5 1.5 34 2" stroke="#C9A961" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <path d="M28 76C30 76 31 75 31 73C31 71 29 70 27 70.5" stroke="#C9A961" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M31 73C31 74.5 32.5 75.5 34 75" stroke="#C9A961" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <line x1="32" y1="10" x2="32" y2="16" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
                <line x1="36" y1="10" x2="36" y2="16" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
                <ellipse cx="34" cy="7" rx="4" ry="4.5" stroke="#C9A961" stroke-width="1.5" fill="none"/>
                <path d="M28 16C30 16 32 18 32 22V28" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M40 16C38 16 36 18 36 22V28" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M28 28C26 30 22 38 20 52" stroke="#C9A961" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <path d="M40 28C42 30 46 38 48 52" stroke="#C9A961" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <path d="M20 52C20 56 22 60 28 62" stroke="#C9A961" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <path d="M48 52C48 56 46 60 40 62" stroke="#C9A961" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <line x1="28" y1="62" x2="26" y2="70" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
                <line x1="40" y1="62" x2="42" y2="70" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
                <line x1="24" y1="70" x2="44" y2="70" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Ornate Spinner -->
        <div class="spinner-wrapper">
            <div class="spinner-outer"></div>
            <div class="spinner-inner"></div>
            <div class="spinner-dots">
                <span class="spinner-dot"></span>
                <span class="spinner-dot"></span>
                <span class="spinner-dot"></span>
                <span class="spinner-dot"></span>
            </div>
            <div class="spinner-center">
                <svg viewBox="0 0 24 24" fill="none" stroke="#C9A961" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
            </div>
        </div>

        <!-- Heading -->
        <h1 class="heading">We're Polishing Our Collection</h1>

        <!-- Subtext -->
        <p class="subtext">
            Our store is temporarily closed for maintenance. 
            We're making improvements to bring you an even better shopping experience.
        </p>

        <!-- Progress Bar -->
        <div class="progress-section">
            <div class="progress-label">
                <span class="progress-text">Almost There</span>
                <span class="progress-percent" id="progressPercent">Updating...</span>
            </div>
            <div class="progress-bar-track">
                <div class="progress-bar-fill"></div>
            </div>
        </div>

        <!-- Divider -->
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-icon"></span>
            <span class="divider-line"></span>
        </div>

        <!-- Email Notify -->
        <div class="notify-section">
            <p class="notify-heading">Notify Me When Ready</p>
            <form class="notify-form" onsubmit="event.preventDefault(); this.querySelector('button').textContent='Thank You!'; this.querySelector('button').style.background='linear-gradient(135deg, #5D4E37, #1A1A1A)';">
                <input type="email" class="notify-input" placeholder="Enter your email address" required aria-label="Email address">
                <button type="submit" class="notify-btn">Notify Me</button>
            </form>
        </div>

        <!-- Estimated Time -->
        <div class="estimate">
            <span class="estimate-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </span>
            <span class="estimate-text">
                Estimated return: <span class="estimate-time">Today, 6:00 PM GST</span>
            </span>
        </div>

        <!-- Social Links -->
        <div class="social-section">
            <p class="social-label">Follow Us in the Meantime</p>
            <div class="social-links">
                <!-- Instagram -->
                <a href="#" class="social-link" aria-label="Instagram">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                </a>
                <!-- Facebook -->
                <a href="#" class="social-link" aria-label="Facebook">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"></path>
                    </svg>
                </a>
                <!-- X/Twitter -->
                <a href="#" class="social-link" aria-label="X">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </a>
                <!-- Pinterest -->
                <a href="#" class="social-link" aria-label="Pinterest">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2C6.477 2 2 6.477 2 12c0 4.236 2.636 7.855 6.356 9.312-.088-.791-.167-2.005.035-2.868.181-.78 1.172-4.97 1.172-4.97s-.299-.598-.299-1.482c0-1.388.806-2.425 1.808-2.425.853 0 1.265.64 1.265 1.408 0 .858-.546 2.14-.828 3.33-.236.995.5 1.807 1.48 1.807 1.778 0 3.144-1.874 3.144-4.58 0-2.393-1.72-4.068-4.177-4.068-2.845 0-4.515 2.135-4.515 4.34 0 .859.331 1.781.745 2.282a.3.3 0 01.069.288l-.278 1.133c-.044.183-.145.222-.335.134-1.249-.581-2.03-2.407-2.03-3.874 0-3.154 2.292-6.052 6.608-6.052 3.469 0 6.165 2.473 6.165 5.776 0 3.447-2.173 6.22-5.19 6.22-1.013 0-1.965-.527-2.291-1.148l-.623 2.378c-.226.869-.835 1.958-1.244 2.621.937.29 1.931.446 2.962.446 5.523 0 10-4.477 10-10S17.523 2 12 2z"/>
                    </svg>
                </a>
                <!-- TikTok -->
                <a href="#" class="social-link" aria-label="TikTok">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 00-.79-.05A6.34 6.34 0 003.15 15.2a6.34 6.34 0 0010.86 4.46V13a8.28 8.28 0 005.58 2.17V11.7a4.83 4.83 0 01-3.77-1.85V6.69h3.77z"/>
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        // Animate progress percentage text
        const percentEl = document.getElementById('progressPercent');
        let percent = 45;
        let direction = 1;

        setInterval(() => {
            percent += direction * (Math.random() * 2 + 0.5);
            if (percent >= 85) direction = -1;
            if (percent <= 30) direction = 1;
            percentEl.textContent = Math.round(percent) + '%';
        }, 2000);
    </script>

</body>
</html>
