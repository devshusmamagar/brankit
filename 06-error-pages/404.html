<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | SHUSMA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #C9A961;
            --dark-gold: #A07D3F;
            --light-gold: #E2CC8A;
            --cream: #FAF8F5;
            --brown: #5D4E37;
            --dark: #1A1A1A;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cream);
            color: var(--brown);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle gold pattern overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(201,169,97,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(201,169,97,0.04) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(201,169,97,0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* Repeating ornate pattern */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23C9A961' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 2rem 1.5rem;
            max-width: 640px;
            width: 100%;
        }

        /* Logo */
        .logo {
            margin-bottom: 2rem;
        }

        .logo svg {
            width: 56px;
            height: 64px;
        }

        /* Decorative top ornament */
        .ornament-top {
            margin: 0 auto 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .ornament-line {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .ornament-diamond {
            width: 8px;
            height: 8px;
            border: 1px solid var(--gold);
            transform: rotate(45deg);
            flex-shrink: 0;
        }

        /* 404 Number */
        .error-number {
            font-family: 'Playfair Display', serif;
            font-size: clamp(100px, 20vw, 180px);
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(
                135deg,
                var(--dark-gold) 0%,
                var(--gold) 25%,
                var(--light-gold) 50%,
                var(--gold) 75%,
                var(--dark-gold) 100%
            );
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: goldShimmer 4s ease-in-out infinite;
            position: relative;
            letter-spacing: -0.02em;
        }

        @keyframes goldShimmer {
            0%, 100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        /* Subtle glow behind 404 */
        .error-number::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-size: clamp(100px, 20vw, 180px);
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, var(--gold), var(--light-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: blur(30px);
            opacity: 0.15;
            z-index: -1;
            animation: goldShimmer 4s ease-in-out infinite;
        }

        /* Heading message */
        .error-heading {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.25rem, 4vw, 1.75rem);
            font-weight: 500;
            color: var(--brown);
            margin-bottom: 0.75rem;
            font-style: italic;
        }

        /* Subtext */
        .error-subtext {
            font-family: 'Inter', sans-serif;
            font-size: clamp(0.875rem, 2.5vw, 1rem);
            color: var(--brown);
            opacity: 0.7;
            margin-bottom: 2rem;
            line-height: 1.6;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Decorative divider */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .divider-line {
            width: 40px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold));
        }

        .divider-line:last-child {
            background: linear-gradient(90deg, var(--gold), transparent);
        }

        .divider-ornament {
            color: var(--gold);
            font-size: 14px;
            line-height: 1;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            width: 100%;
            max-width: 360px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 36px;
            background: linear-gradient(135deg, var(--gold), var(--dark-gold));
            color: var(--cream);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 280px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--dark-gold), var(--brown));
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(201, 169, 97, 0.3);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 36px;
            background: transparent;
            color: var(--gold);
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
            border: 1px solid var(--gold);
            border-radius: 0;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            max-width: 280px;
        }

        .btn-secondary:hover {
            background: var(--gold);
            color: var(--cream);
            transform: translateY(-1px);
        }

        /* Search bar */
        .search-section {
            margin-top: 1.5rem;
            width: 100%;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            color: var(--brown);
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            display: block;
        }

        .search-wrapper {
            display: flex;
            border: 1px solid var(--gold);
            transition: border-color 0.3s ease;
        }

        .search-wrapper:focus-within {
            border-color: var(--dark-gold);
            box-shadow: 0 0 0 2px rgba(201, 169, 97, 0.15);
        }

        .search-input {
            flex: 1;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.875rem;
            color: var(--brown);
            background: transparent;
            border: none;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--brown);
            opacity: 0.4;
        }

        .search-btn {
            padding: 12px 20px;
            background: var(--gold);
            color: var(--cream);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background: var(--dark-gold);
        }

        .search-btn svg {
            width: 18px;
            height: 18px;
        }

        /* Bottom ornament */
        .ornament-bottom {
            margin-top: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .ornament-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0.5;
        }

        .ornament-dot.center {
            width: 6px;
            height: 6px;
            opacity: 0.8;
        }

        /* Corner decorations */
        .corner-ornament {
            position: fixed;
            width: 80px;
            height: 80px;
            opacity: 0.08;
            pointer-events: none;
        }

        .corner-ornament.top-left {
            top: 20px;
            left: 20px;
            border-top: 2px solid var(--gold);
            border-left: 2px solid var(--gold);
        }

        .corner-ornament.top-right {
            top: 20px;
            right: 20px;
            border-top: 2px solid var(--gold);
            border-right: 2px solid var(--gold);
        }

        .corner-ornament.bottom-left {
            bottom: 20px;
            left: 20px;
            border-bottom: 2px solid var(--gold);
            border-left: 2px solid var(--gold);
        }

        .corner-ornament.bottom-right {
            bottom: 20px;
            right: 20px;
            border-bottom: 2px solid var(--gold);
            border-right: 2px solid var(--gold);
        }

        /* Responsive */
        @media (min-width: 480px) {
            .btn-group {
                flex-direction: row;
                justify-content: center;
                max-width: none;
            }

            .btn-primary, .btn-secondary {
                width: auto;
            }
        }

        @media (min-width: 768px) {
            .container {
                padding: 3rem 2rem;
            }

            .logo svg {
                width: 64px;
                height: 72px;
            }

            .corner-ornament {
                width: 120px;
                height: 120px;
            }

            .ornament-line {
                width: 100px;
            }

            .divider-line {
                width: 70px;
            }
        }
    </style>
</head>
<body>

    <!-- Corner Ornaments -->
    <div class="corner-ornament top-left"></div>
    <div class="corner-ornament top-right"></div>
    <div class="corner-ornament bottom-left"></div>
    <div class="corner-ornament bottom-right"></div>

    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <svg viewBox="0 0 64 80" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- L-bracket frame with scrollwork -->
                <path d="M8 4C8 2 9 1 11 1H28" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M8 4V72C8 74 9 76 11 76H28" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round"/>
                <!-- Scrollwork top -->
                <path d="M28 1C30 1 31 2 31 4C31 6 29 7 27 6.5" stroke="#C9A961" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M31 4C31 2.5 32.5 1.5 34 2" stroke="#C9A961" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <!-- Scrollwork bottom -->
                <path d="M28 76C30 76 31 75 31 73C31 71 29 70 27 70.5" stroke="#C9A961" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M31 73C31 74.5 32.5 75.5 34 75" stroke="#C9A961" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <!-- Mannequin dress form -->
                <path d="M32 16C30 16 28 18 28 22V28" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M36 16C38 16 40 18 40 22V28" stroke="#C9A961" stroke-width="2" fill="none" stroke-linecap="round"/>
                <path d="M28 22C28 20 30 18 32 18" stroke="#C9A961" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <path d="M40 22C40 20 38 18 36 18" stroke="#C9A961" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                <!-- Neck -->
                <line x1="32" y1="10" x2="32" y2="16" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
                <line x1="36" y1="10" x2="36" y2="16" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
                <!-- Head -->
                <ellipse cx="34" cy="7" rx="4" ry="4.5" stroke="#C9A961" stroke-width="1.5" fill="none"/>
                <!-- Dress body -->
                <path d="M28 28C26 30 22 38 20 52" stroke="#C9A961" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <path d="M40 28C42 30 46 38 48 52" stroke="#C9A961" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <path d="M20 52C20 56 22 60 28 62" stroke="#C9A961" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <path d="M48 52C48 56 46 60 40 62" stroke="#C9A961" stroke-width="1.8" fill="none" stroke-linecap="round"/>
                <!-- Waist detail -->
                <path d="M27 42C29 41 33 40 34 40C35 40 39 41 41 42" stroke="#C9A961" stroke-width="1" fill="none" stroke-linecap="round" stroke-dasharray="2 3"/>
                <!-- Stand -->
                <line x1="28" y1="62" x2="26" y2="70" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
                <line x1="40" y1="62" x2="42" y2="70" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
                <line x1="24" y1="70" x2="44" y2="70" stroke="#C9A961" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Top Ornament -->
        <div class="ornament-top">
            <span class="ornament-line"></span>
            <span class="ornament-diamond"></span>
            <span class="ornament-line"></span>
        </div>

        <!-- Error Number -->
        <div class="error-number">404</div>

        <!-- Heading -->
        <h1 class="error-heading">This page has wandered off the runway</h1>

        <!-- Subtext -->
        <p class="error-subtext">
            The page you're looking for doesn't exist or has been moved. 
            Let us help you find your way back to our collection.
        </p>

        <!-- Divider -->
        <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-ornament">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <path d="M8 1L9.5 6H15L10.5 9.5L12 15L8 11.5L4 15L5.5 9.5L1 6H6.5L8 1Z" fill="#C9A961" opacity="0.6"/>
                </svg>
            </span>
            <span class="divider-line"></span>
        </div>

        <!-- Buttons -->
        <div class="btn-group">
            <a href="/" class="btn-primary">Back to Home</a>
            <a href="/collections" class="btn-secondary">Browse Collections</a>
        </div>

        <!-- Search -->
        <div class="search-section">
            <label class="search-label">Search our collections</label>
            <div class="search-wrapper">
                <input type="text" class="search-input" placeholder="What are you looking for?" aria-label="Search">
                <button class="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Bottom Ornament -->
        <div class="ornament-bottom">
            <span class="ornament-dot"></span>
            <span class="ornament-dot"></span>
            <span class="ornament-dot center"></span>
            <span class="ornament-dot"></span>
            <span class="ornament-dot"></span>
        </div>
    </div>

</body>
</html>
